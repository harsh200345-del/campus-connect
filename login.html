{% extends "base.html" %}

{% block title %}Sign In — CampusConnect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card p-4 p-md-5 border-0 shadow-sm rounded-4">
                <div class="text-center mb-4">
                    <div class="bg-primary-subtle text-primary d-inline-flex p-3 rounded-circle mb-3">
                        <i class="fa-solid fa-graduation-cap fs-2"></i>
                    </div>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your personalized campus hub</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small text-muted">College Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="e.g. student@campusconnect.edu" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold small text-muted">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill shadow-sm mb-3">
                        Sign In <i class="fa-solid fa-arrow-right ms-2"></i>
                    </button>
                </form>

                <!-- Quick Autofill for Viva / Demo -->
                <div class="border-top pt-3 mt-2 text-center">
                    <span class="badge bg-light text-secondary border mb-2">💡 Quick Demo Logins</span>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-sm btn-outline-success w-50 rounded-pill" onclick="fillCredentials('student@campusconnect.edu', 'student123')">
                            <i class="fa-solid fa-user-graduate me-1"></i> Demo Student
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger w-50 rounded-pill" onclick="fillCredentials('admin@campusconnect.edu', 'admin123')">
                            <i class="fa-solid fa-shield-halved me-1"></i> Demo Admin
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">Don't have an account? 
                        <a href="{{ url_for('register') }}" class="fw-bold text-primary text-decoration-none">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillCredentials(email, pass) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
